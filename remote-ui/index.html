<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APEX Remote</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body><main><header><strong>APEX <span>REMOTE</span></strong><p id="connection">Pair with your PC. Execution and keys stay there.</p></header><form id="pair"><label for="code">One-time pairing code</label><div class="row"><input id="code" type="password" autocomplete="off" required><button>Pair device</button></div></form><section id="workspace" hidden><div class="toolbar"><span id="policy"></span><button id="cancel" type="button">Cancel turn</button><button id="leave" type="button">Disconnect</button></div><div id="messages" aria-live="polite"></div><section id="approvals" aria-label="Tool approval requests"></section><form id="prompt"><label for="text">Message your local agent</label><textarea id="text" rows="4" required placeholder="What should APEX work on?"></textarea><div class="row"><select id="mode" aria-label="Mode"><option value="plan">Plan</option><option value="build">Build</option></select><button id="send">Send to PC</button></div></form></section><p id="error" role="alert"></p><footer>This controls your selected APEX session. Your PC must remain on.</footer></main></body></html>
