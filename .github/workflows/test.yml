name: Test
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install chromium
      - run: npm test
      - run: node server/runtime/selftest.mjs
      - run: npm pack --dry-run --ignore-scripts
