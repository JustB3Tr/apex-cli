name: Build verified npm artifact
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install chromium
      - run: npm run test:ci
      - run: node server/runtime/selftest.mjs
      - name: Pack the checked-out GitHub source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $apexVersion = node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version"
          npm pack --json --ignore-scripts | Set-Content "artifacts/pack-$apexVersion.json" -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-package.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $apexArchive = "apex-agent-cli-$apexVersion.tgz"
          $apexDigest = (Get-FileHash -LiteralPath $apexArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$apexDigest  $apexArchive" | Set-Content "$apexArchive.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: apex-npm-release
          path: |
            apex-agent-cli-*.tgz
            apex-agent-cli-*.tgz.sha256
            artifacts/pack-*.json
            artifacts/package-*-proof.json
          if-no-files-found: error
          retention-days: 14
